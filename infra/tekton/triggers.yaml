# Triggers Tekton para o webhook push do Gitea no repo labadmin/amactive.
#
# Fluxo (DOIS Triggers independentes na mesma EventListener — path
# filtering, ver nota abaixo):
#   Gitea push → EventListener (amactive-event-listener)
#     ├─ Trigger amactive-gitea-push-api
#     │    ↓ github interceptor (valida HMAC) → cel interceptor (filtra
#     │      refs/heads/main + só segue se algum arquivo do push tocou a
#     │      API) → amactive-gitea-binding → amactive-build-api-template
#     │    PipelineRun amactive-build-api-<sha7>-...
#     └─ Trigger amactive-gitea-push-web (mesma ideia, filtro do web)
#          PipelineRun amactive-build-web-<sha7>-...
#
# Path filtering (CEL): antes, TODO push disparava os dois pipelines,
# mesmo quando só um lado (ou só docs/infra não-relacionada) mudava — no
# nó `workload: cicd` deste lab (compartilhado com ArgoCD/Gitea/Harbor/
# monitoring, não exclusivo de build, ~70% de CPU/memória já reservados em
# steady-state) dois `kaniko-build-push` concorrentes já bastam para
# `ExceededNodeResources` (visto na prática em 2026-09-22). Cada Trigger
# abaixo só cria o PipelineRun do seu lado se o push tiver tocado um
# caminho que MUDA A IMAGEM publicada: `apps/api/**`/`migrations/**`/
# `infra/k8s/api/**` (ou vice-versa para web).
#
# Deliberadamente NÃO inclui `infra/tekton/**` (task de git-clone/kaniko,
# os pipelines, este próprio arquivo) como "compartilhado" — uma primeira
# versão desta filtragem incluía, com a lógica de "mudou algo que os dois
# pipelines usam, builda os dois por precaução". Na prática isso builda (e
# faz `rollout-restart` de) uma imagem IDÊNTICA à já publicada toda vez
# que só a definição do PIPELINE muda, sem nenhum código de aplicação
# novo — desperdício puro, e foi exatamente o que consumiu o node inteiro
# por 30min sem produzir nenhuma imagem nova em 2026-09-22. Uma mudança em
# `infra/tekton/**` só precisa valer para o PRÓXIMO push de código real;
# para testar a Task/Pipeline em si isoladamente, use os
# `pipelinerun-*-manual.yaml.example` (`kubectl create`, não dispara pelo
# webhook). Um push só de `docs/*.md`/`infra/README.md`/`infra/tekton/**`
# agora não builda nada.
#
# Sobre o interceptor "github": não existe ClusterInterceptor "gitea" neste
# cluster (só cel, github, gitlab, bitbucket, slack). Gitea >= 1.16 envia,
# além do X-Gitea-Signature nativo, um X-Hub-Signature-256 no mesmo formato
# do GitHub (HMAC-SHA256, prefixo "sha256=") especificamente para
# compatibilidade — mesma solução já usada pelo amfit e pelo realtpmsys
# neste cluster. Requer configurar o mesmo secret na Secret K8s referenciada
# abaixo e no campo "Secret" do webhook no Gitea.
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: amactive-gitea-binding
  namespace: cicd
  labels:
    app.kubernetes.io/component: "trigger-binding"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "amactive-tekton"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.head_commit.id)
    - name: git-revision-short
      value: $(extensions.short_sha)
    - name: git-ref
      value: $(body.ref)
    - name: pusher
      value: $(body.pusher.username)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: amactive-build-api-template
  namespace: cicd
  labels:
    app.kubernetes.io/component: "trigger-template"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "amactive-tekton"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  params:
    - name: git-url
    - name: git-revision
    - name: git-revision-short
    - name: git-ref
    - name: pusher
      default: "unknown"
  # ATENÇÃO: a API do Tekton Triggers v1beta1 espera "resourcetemplates"
  # (tudo minúsculo) — "resourceTemplates" (camelCase) é um campo desconhecido
  # pro schema do CRD e é descartado silenciosamente pelo apiserver. Bug real
  # já encontrado no amfit-build-template (infra/tekton/trigger-amfit.yaml)
  # em 2026-09-04 — grafia abaixo já replica a correção.
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: amactive-build-api-$(tt.params.git-revision-short)-
        namespace: cicd
        annotations:
          gitea.io/pusher: "$(tt.params.pusher)"
          gitea.io/ref: "$(tt.params.git-ref)"
        labels:
          app.kubernetes.io/component: "pipelinerun-api"
          app.kubernetes.io/managed-by: "argocd"
          app.kubernetes.io/name: "amactive-tekton"
          environment: "dev"
          git-revision-short: "$(tt.params.git-revision-short)"
          lab_id: "lab-k8s-01"
          lab_owner: "jose.mussauer"
          tekton.dev/pipeline: "amactive-build-api"
          trigger: "gitea-push"
      spec:
        pipelineRef:
          name: amactive-build-api
        timeouts:
          pipeline: "30m"
          tasks: "20m"
        taskRunTemplate:
          serviceAccountName: tekton-amactive
          podTemplate:
            nodeSelector:
              workload: cicd
            securityContext:
              fsGroup: 1000
        params:
          - name: git-url
            value: "http://gitea-http.cicd.svc.cluster.local:3000/labadmin/amactive.git"
          - name: git-revision
            value: "$(tt.params.git-revision)"
          - name: image-repo
            value: "harbor.lab.local/amactive/api"
          - name: image-tag
            value: "sha-$(tt.params.git-revision-short)"
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: "5Gi"
                storageClassName: local-path
          - name: docker-credentials
            secret:
              secretName: harbor-push-amactive
              items:
                - key: .dockerconfigjson
                  path: config.json
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: amactive-build-web-template
  namespace: cicd
  labels:
    app.kubernetes.io/component: "trigger-template"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "amactive-tekton"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  params:
    - name: git-url
    - name: git-revision
    - name: git-revision-short
    - name: git-ref
    - name: pusher
      default: "unknown"
  # ATENÇÃO: "resourcetemplates" minúsculo — ver nota no template da API.
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: amactive-build-web-$(tt.params.git-revision-short)-
        namespace: cicd
        annotations:
          gitea.io/pusher: "$(tt.params.pusher)"
          gitea.io/ref: "$(tt.params.git-ref)"
        labels:
          app.kubernetes.io/component: "pipelinerun-web"
          app.kubernetes.io/managed-by: "argocd"
          app.kubernetes.io/name: "amactive-tekton"
          environment: "dev"
          git-revision-short: "$(tt.params.git-revision-short)"
          lab_id: "lab-k8s-01"
          lab_owner: "jose.mussauer"
          tekton.dev/pipeline: "amactive-build-web"
          trigger: "gitea-push"
      spec:
        pipelineRef:
          name: amactive-build-web
        timeouts:
          pipeline: "30m"
          tasks: "20m"
        taskRunTemplate:
          serviceAccountName: tekton-amactive
          podTemplate:
            nodeSelector:
              workload: cicd
            securityContext:
              fsGroup: 1000
            # DNS combo recomendado pelo realtpmsys para builds npm neste
            # lab (CoreDNS retorna AAAA-only intermitente para
            # registry.npmjs.org) — replicado aqui preventivamente porque o
            # web do AMACTIVE também roda `npm ci`. Remover se a infra-lab
            # corrigir o CoreDNS/Pi-hole antes disso ser necessário.
            dnsPolicy: "None"
            dnsConfig:
              nameservers:
                - 10.43.0.10
                - 1.1.1.1
                - 8.8.8.8
              searches:
                - cicd.svc.cluster.local
                - svc.cluster.local
                - cluster.local
              options:
                - name: ndots
                  value: "5"
                - name: single-request-reopen
        params:
          - name: git-url
            value: "http://gitea-http.cicd.svc.cluster.local:3000/labadmin/amactive.git"
          - name: git-revision
            value: "$(tt.params.git-revision)"
          - name: image-repo
            value: "harbor.lab.local/amactive/web"
          - name: image-tag
            value: "sha-$(tt.params.git-revision-short)"
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: "5Gi"
                storageClassName: local-path
          - name: docker-credentials
            secret:
              secretName: harbor-push-amactive
              items:
                - key: .dockerconfigjson
                  path: config.json
---
# amactive-gitea-push-api: só cria o PipelineRun da API se o push tocou
# apps/api/**, migrations/** ou infra/k8s/api/** — nunca infra/tekton/**
# (ver nota no cabeçalho deste arquivo).
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: amactive-gitea-push-api
  namespace: cicd
  labels:
    app.kubernetes.io/component: "trigger"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "amactive-tekton"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  serviceAccountName: tekton-amactive
  bindings:
    - ref: amactive-gitea-binding
      kind: TriggerBinding
  interceptors:
    - ref:
        kind: ClusterInterceptor
        name: github
      params:
        - name: secretRef
          value:
            secretName: gitea-webhook-secret-amactive
            secretKey: secretToken
    - ref:
        kind: ClusterInterceptor
        name: cel
      params:
        - name: filter
          value: >-
            body.ref == 'refs/heads/main' && body.head_commit.id != '' &&
            body.commits.exists(c, (c.added + c.modified + c.removed).exists(f,
              f.startsWith('apps/api/') || f.startsWith('migrations/') ||
              f.startsWith('infra/k8s/api/')
            ))
        - name: overlays
          value:
            - key: short_sha
              expression: "body.head_commit.id.truncate(7)"
  template:
    ref: amactive-build-api-template
---
# amactive-gitea-push-web: mesma ideia, filtro de apps/web/** e
# infra/k8s/web/**.
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: amactive-gitea-push-web
  namespace: cicd
  labels:
    app.kubernetes.io/component: "trigger"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "amactive-tekton"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  serviceAccountName: tekton-amactive
  bindings:
    - ref: amactive-gitea-binding
      kind: TriggerBinding
  interceptors:
    - ref:
        kind: ClusterInterceptor
        name: github
      params:
        - name: secretRef
          value:
            secretName: gitea-webhook-secret-amactive
            secretKey: secretToken
    - ref:
        kind: ClusterInterceptor
        name: cel
      params:
        - name: filter
          value: >-
            body.ref == 'refs/heads/main' && body.head_commit.id != '' &&
            body.commits.exists(c, (c.added + c.modified + c.removed).exists(f,
              f.startsWith('apps/web/') || f.startsWith('infra/k8s/web/')
            ))
        - name: overlays
          value:
            - key: short_sha
              expression: "body.head_commit.id.truncate(7)"
  template:
    ref: amactive-build-web-template
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: amactive-event-listener
  namespace: cicd
  labels:
    app.kubernetes.io/component: "event-listener"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "amactive-tekton"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  serviceAccountName: tekton-amactive
  triggers:
    - triggerRef: amactive-gitea-push-api
    - triggerRef: amactive-gitea-push-web
  resources:
    kubernetesResource:
      serviceType: ClusterIP
      spec:
        template:
          metadata:
            labels:
              app.kubernetes.io/component: "event-listener"
              app.kubernetes.io/name: "amactive-tekton"
              environment: "dev"
              lab_id: "lab-k8s-01"
              lab_owner: "jose.mussauer"
          spec:
            nodeSelector:
              workload: cicd
            containers:
              - resources:
                  requests:
                    cpu: "50m"
                    memory: "64Mi"
                  limits:
                    cpu: "200m"
                    memory: "256Mi"
