# ServiceAccount + RBAC para a pipeline Tekton do AMACTIVE.
# Espelha o padrão do tekton-realtpmsys/tekton-amfit:
#   - imagePullSecrets aponta para harbor-push-amactive (robot account do
#     Harbor com push+pull em amactive/*)
#   - Role tekton-amactive: permite criar PipelineRuns/TaskRuns no ns cicd
#   - tekton-amactive-triggers (+ triggers-cluster): ClusterRoles padrão do
#     Tekton Triggers, necessários para o EventListener criar PipelineRuns a
#     partir do Trigger.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-amactive
  namespace: cicd
  labels:
    app.kubernetes.io/component: "ci-serviceaccount"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "amactive-tekton"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
imagePullSecrets:
  - name: harbor-push-amactive
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-amactive
  namespace: cicd
  labels:
    app.kubernetes.io/component: "ci-rbac"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "amactive-tekton"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
rules:
  # PipelineRuns / TaskRuns são criados pelo EventListener quando dispara o webhook
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "pipelineresources", "taskruns"]
    verbs: ["get", "list", "create", "patch"]
  # Workspaces precisam de PVC dinâmico (volumeClaimTemplate)
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "events"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-amactive
  namespace: cicd
  labels:
    app.kubernetes.io/component: "ci-rbac"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "amactive-tekton"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-amactive
subjects:
  - kind: ServiceAccount
    name: tekton-amactive
    namespace: cicd
---
# ClusterRole padrão do Tekton Triggers para EventListeners criarem recursos
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-amactive-triggers
  namespace: cicd
  labels:
    app.kubernetes.io/component: "ci-rbac"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "amactive-tekton"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
subjects:
  - kind: ServiceAccount
    name: tekton-amactive
    namespace: cicd
---
# ClusterRoleBinding necessário para o EventListener LER recursos
# cluster-scoped: ClusterInterceptor e ClusterTriggerBinding.
# Sem isso o pod do listener entra em CrashLoop por forbidden.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-amactive-triggers-cluster
  labels:
    app.kubernetes.io/component: "ci-rbac"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/name: "amactive-tekton"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
subjects:
  - kind: ServiceAccount
    name: tekton-amactive
    namespace: cicd
