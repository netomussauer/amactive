# Deployment do apps/web — SPA Vite (React + TS) servida por nginx
# (nginxinc/nginx-unprivileged, ver apps/web/Dockerfile — justificativa da
# escolha de nginx em vez do padrão node-distroless usado pelo
# amfit-web/realtpmsys-web está no próprio Dockerfile: sem SSR, servidor
# estático é suficiente e mais leve).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amactive-web
  namespace: amactive
  labels:
    app.kubernetes.io/name: "amactive-web"
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/component: "frontend"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "amactive-web"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "amactive-web"
        app.kubernetes.io/version: "latest"
        app.kubernetes.io/component: "frontend"
        environment: "dev"
        lab_id: "lab-k8s-01"
        lab_owner: "jose.mussauer"
    spec:
      nodeSelector:
        workload: cicd
      imagePullSecrets:
        - name: harbor-pull-secret
      securityContext:
        runAsNonRoot: true
        # uid/gid 101 = usuário `nginx` da imagem nginxinc/nginx-unprivileged.
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          image: harbor.lab.local/amactive/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Sem env vars de runtime aqui de propósito: VITE_API_URL já foi
          # embutida no bundle JS em build time (ver apps/web/Dockerfile e
          # infra/tekton/pipeline-web.yaml, build-arg VITE_API_URL) — Vite
          # não lê variáveis de ambiente do container em runtime.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            # Perfil "sidecar/auxiliar" da tabela de dimensionamento — nginx
            # servindo apenas arquivos estáticos de uma SPA é muito mais leve
            # que o runtime Node do amfit-web/realtpmsys-web (SSR Next.js).
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        # nginx (mesmo unprivileged) precisa gravar em /tmp, no diretório de
        # cache e no pidfile de /var/run mesmo sem servir conteúdo dinâmico —
        # com readOnlyRootFilesystem: true, esses caminhos precisam ser
        # emptyDir explícitos.
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
