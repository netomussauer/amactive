apiVersion: v1
kind: Service
metadata:
  name: amactive-web
  namespace: amactive
  labels:
    app.kubernetes.io/name: "amactive-web"
    app.kubernetes.io/component: "frontend"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  # Exposição via MetalLB. DNS sugerido: app.amactive.local -> 192.168.1.213.
  # IP candidato — CONFIRMAR/RESERVAR no NetBox antes de aplicar de verdade
  # (ver infra/README.md e o comentário equivalente em
  # infra/k8s/api/service.yaml).
  type: LoadBalancer
  loadBalancerIP: 192.168.1.213
  selector:
    app.kubernetes.io/name: "amactive-web"
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
