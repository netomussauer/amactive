# Deployment da VITRINE (loja online pública) — build `npm run build:loja`
# servido por nginx (apps/web/Dockerfile.loja, apps/web/nginx.loja.conf).
#
# Mesmo perfil do amactive-web (SPA estática, sem SSR). Diferenças: imagem
# própria (harbor.lab.local/amactive/loja) e nginx com allow-list mínima de
# /api/ (só /api/loja e /api/media chegam à API).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amactive-loja
  namespace: amactive
  labels:
    app.kubernetes.io/name: "amactive-loja"
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/component: "storefront"
    app.kubernetes.io/managed-by: "argocd"
    app.kubernetes.io/part-of: "amactive"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "amactive-loja"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "amactive-loja"
        app.kubernetes.io/version: "latest"
        app.kubernetes.io/component: "storefront"
        environment: "dev"
        lab_id: "lab-k8s-01"
        lab_owner: "jose.mussauer"
    spec:
      nodeSelector:
        workload: cicd
      imagePullSecrets:
        - name: harbor-pull-secret
      securityContext:
        runAsNonRoot: true
        # uid/gid 101 = usuário `nginx` da imagem nginxinc/nginx-unprivileged.
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: loja
          image: harbor.lab.local/amactive/loja:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
