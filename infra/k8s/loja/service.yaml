# Service da VITRINE (loja online) exposto na rede do lab via MetalLB.
#
# IP reservado no NetBox (lb_amactive_loja, infra-lab/terraform/proxmox/netbox.tf)
# e DNS no Pi-hole: loja.amactive.local -> 192.168.1.214.
#
# Acesso apenas pela LAN do lab. Não é exposição pública: a publicação na
# internet (loja.amactive.com.br, atrás da Cloudflare) é item separado, da fase
# de produção (ver docs/arquitetura-producao.md).
apiVersion: v1
kind: Service
metadata:
  name: amactive-loja
  namespace: amactive
  labels:
    app.kubernetes.io/name: "amactive-loja"
    app.kubernetes.io/component: "storefront"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.214
  selector:
    app.kubernetes.io/name: "amactive-loja"
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
