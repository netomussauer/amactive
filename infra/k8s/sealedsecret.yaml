# SealedSecret real do AMACTIVE — gerado em 2026-09-14 via kubeseal contra o
# certificado público do controller sealed-secrets-controller (namespace
# kube-system) do cluster lab-k8s-01. Seguro de commitar: só o controller
# real desse cluster consegue decriptar `encryptedData` abaixo.
#
# Chaves: pg-password (senha gerada para a role `amactive` no Postgres
# compartilhado, ver infra/README.md passo 1) e jwt-secret (openssl rand
# -base64 48). Nenhum valor em texto puro foi commitado nem ficou salvo em
# disco além do /tmp efêmero desta sessão (já removido).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: amactive-secrets
  namespace: amactive
spec:
  encryptedData:
    jwt-secret: 
    pg-password: 
  template:
    metadata:
      name: amactive-secrets
      namespace: amactive
      labels:
        app.kubernetes.io/name: "amactive"
        app.kubernetes.io/component: "config"
        app.kubernetes.io/managed-by: "argocd"
        environment: "dev"
        lab_id: "lab-k8s-01"
        lab_owner: "jose.mussauer"
    type: Opaque
