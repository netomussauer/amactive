# Exposição PÚBLICA do único endpoint de integração da API AMACTIVE: o webhook
# da Nuvemshop. Caminho: Internet -> Cloudflare (DNS/WAF) -> cloudflared
# (namespace edge, outbound-only) -> ingress-nginx interno (ClusterIP) ->
# este Ingress -> Service amactive-api. Ver infra-lab/docs/adr.md ADR-013 e
# infra-lab/kubernetes/edge/ingress-template.yaml (template seguido aqui).
#
# Decisões deliberadas:
#   - `pathType: Exact` (e não Prefix, como no template) — expõe SOMENTE
#     essa rota; qualquer outro caminho (incl. /docs, /openapi.json,
#     /metrics, /auth/login e o resto da API) responde 404 pelo
#     ingress-nginx sem nunca alcançar a API. A autenticação HMAC do
#     webhook (x-linkedstore-hmac-sha256, router.py) é a barreira de
#     aplicação; este Ingress é a barreira de superfície.
#   - Sem a NetworkPolicy opcional do template: o namespace amactive hoje
#     não tem nenhuma NetworkPolicy, e criar uma com `policyTypes: Ingress`
#     selecionando o pod da API a colocaria em default-deny para todo o
#     resto (LoadBalancer MetalLB 192.168.1.212:8000 usado pelo frontend
#     pela LAN, Prometheus, etc.). Se o namespace ganhar uma política de
#     rede geral no futuro, incluir aqui a liberação do namespace `edge`.
#   - Rate limit por IP de origem (limit-rps) no ingress-nginx: o handler do
#     webhook lê e DECIFRA a credencial no banco (pgp_sym_decrypt) ANTES de
#     validar o HMAC, então requisições não autenticadas custam uma ida ao
#     Postgres cada — o limite protege o banco de flood. `use-forwarded-headers`
#     está ativo no controller, então o IP é o do cliente real (não o do
#     cloudflared). Uma resposta 503 do limite não perde evento: a Nuvemshop
#     reentrega webhooks não-2xx.
#   - proxy-body-size 256k: payload real de webhook é minúsculo (id, evento,
#     store_id); o padrão de 1m é folgado demais para uma rota anônima.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amactive-api-public
  namespace: amactive
  labels:
    app.kubernetes.io/name: "amactive-api"
    app.kubernetes.io/component: "public-ingress"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "256k"
spec:
  ingressClassName: nginx
  rules:
    - host: "amactive.amtech.app.br"
      http:
        paths:
          - path: /integracoes/nuvemshop/webhooks
            pathType: Exact
            backend:
              service:
                name: amactive-api
                port:
                  number: 8000
