apiVersion: v1
kind: Service
metadata:
  name: amactive-api
  namespace: amactive
  labels:
    app.kubernetes.io/name: "amactive-api"
    app.kubernetes.io/component: "api"
    app.kubernetes.io/managed-by: "argocd"
    environment: "dev"
    lab_id: "lab-k8s-01"
    lab_owner: "jose.mussauer"
spec:
  # Exposição via MetalLB (lab não tem IngressController dedicado). DNS
  # sugerido: api.amactive.local -> 192.168.1.212.
  #
  # IP candidato — CONFIRMAR/RESERVAR no NetBox antes de aplicar de verdade
  # (ver infra/README.md). Mapa de IPs conhecidos no lab até a pesquisa desta
  # tarefa: 205 amfit-api, 206 amfit-web, 207 amfit-minio, 208
  # realtpmsys-api, 209 livre, 210 grafana, 211 realtpmsys-web — 212/213
  # escolhidos por serem a próxima faixa livre sequencial, não por reserva
  # confirmada.
  type: LoadBalancer
  loadBalancerIP: 192.168.1.212
  selector:
    app.kubernetes.io/name: "amactive-api"
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
