openapi: "3.0.3"
info:
  title: AMACTIVE API
  description: >
    API de controle de estoque e vendas da AMACTIVE (moda fitness feminina).
    Uso interno — sem emissão fiscal e sem gateway de pagamento real no MVP.
    Ver docs/SDD.md para o desenho arquitetural completo.
  version: "0.1.0"
  contact:
    name: AMACTIVE Engineering
servers:
  - url: http://localhost:8000
    description: Ambiente local (docker-compose)

tags:
  - name: Auth
    description: Identidade & Acesso
  - name: Categorias
    description: Catálogo & Estoque
  - name: Produtos
    description: Catálogo & Estoque
  - name: Variantes
    description: Catálogo & Estoque
  - name: Imagens
    description: Catálogo & Estoque
  - name: Estoque
    description: Catálogo & Estoque
  - name: Pedidos
    description: Vendas
  - name: Clientes
    description: Cadastros
  - name: Fornecedores
    description: Cadastros
  - name: Relatorios
    description: Relatórios & Dashboard

security:
  - bearerAuth: []

paths:
  # ───────────────────────── Auth ─────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticar usuário e obter token JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/NaoAutorizado"

  # ───────────────────────── Categorias ─────────────────────────
  /categorias:
    get:
      tags: [Categorias]
      summary: Listar categorias
      operationId: listarCategorias
      responses:
        "200":
          description: Lista de categorias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaListResponse"
    post:
      tags: [Categorias]
      summary: Criar categoria
      operationId: criarCategoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarCategoriaRequest"
      responses:
        "201":
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
        "422":
          $ref: "#/components/responses/ErroValidacao"

  # ───────────────────────── Produtos ─────────────────────────
  /produtos:
    get:
      tags: [Produtos]
      summary: Listar produtos
      operationId: listarProdutos
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: busca
          in: query
          description: Busca textual por nome do produto
          schema: { type: string }
        - name: categoria_id
          in: query
          schema: { type: string, format: uuid }
        - name: ativo
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Lista paginada de produtos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoListResponse"
    post:
      tags: [Produtos]
      summary: Criar produto
      operationId: criarProduto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarProdutoRequest"
      responses:
        "201":
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
        "422":
          $ref: "#/components/responses/ErroValidacao"

  /produtos/{produtoId}:
    parameters:
      - $ref: "#/components/parameters/ProdutoId"
    get:
      tags: [Produtos]
      summary: Obter produto por id (inclui variantes)
      operationId: obterProduto
      responses:
        "200":
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoDetalheResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Produtos]
      summary: Atualizar produto
      operationId: atualizarProduto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarProdutoRequest"
      responses:
        "200":
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "422":
          $ref: "#/components/responses/ErroValidacao"
    delete:
      tags: [Produtos]
      summary: Inativar produto (soft delete — ativo=false)
      operationId: inativarProduto
      responses:
        "204":
          description: Produto inativado
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  # ───────────────────────── Variantes ─────────────────────────
  /produtos/{produtoId}/variantes:
    parameters:
      - $ref: "#/components/parameters/ProdutoId"
    get:
      tags: [Variantes]
      summary: Listar variantes (SKUs) de um produto
      operationId: listarVariantesDoProduto
      responses:
        "200":
          description: Lista de variantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/VarianteResponse" }
    post:
      tags: [Variantes]
      summary: Criar variante (SKU) para um produto
      operationId: criarVariante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarVarianteRequest"
      responses:
        "201":
          description: Variante criada (estoque inicial zerado é criado automaticamente)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VarianteResponse"
        "422":
          $ref: "#/components/responses/ErroValidacao"

  /variantes/{varianteId}:
    parameters:
      - $ref: "#/components/parameters/VarianteId"
    get:
      tags: [Variantes]
      summary: Obter variante por id
      operationId: obterVariante
      responses:
        "200":
          description: Variante encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VarianteResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Variantes]
      summary: Atualizar variante (preço, cor, tamanho)
      operationId: atualizarVariante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarVarianteRequest"
      responses:
        "200":
          description: Variante atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VarianteResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    delete:
      tags: [Variantes]
      summary: Inativar variante (soft delete — ativo=false)
      operationId: inativarVariante
      responses:
        "204":
          description: Variante inativada
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  # ───────────────────────── Imagens ─────────────────────────
  /produtos/{produtoId}/imagens:
    parameters:
      - $ref: "#/components/parameters/ProdutoId"
    get:
      tags: [Imagens]
      summary: Listar imagens (galeria) de um produto
      operationId: listarImagensDoProduto
      parameters:
        - name: cor
          in: query
          description: Filtra a galeria por cor (mesmo valor livre usado em produto_variante.cor)
          schema: { type: string }
      responses:
        "200":
          description: Galeria de imagens do produto, ordenada por `cor` e `ordem`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagemListResponse"
    post:
      tags: [Imagens]
      summary: Upload de imagem de produto
      description: >
        A `cor` informada precisa corresponder a uma cor existente entre as
        variantes ativas do produto (senão 422 — `cor` não é FK, ver
        docs/data-model.md decisão #13). Aceita apenas `image/jpeg`,
        `image/png` e `image/webp`, até 5MB. A primeira imagem enviada para
        uma cor é automaticamente marcada como `principal`.
      operationId: uploadImagem
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cor, arquivo]
              properties:
                cor: { type: string, maxLength: 50 }
                arquivo: { type: string, format: binary }
      responses:
        "201":
          description: Imagem criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagemResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "422":
          $ref: "#/components/responses/ErroValidacao"
        "413":
          description: Arquivo excede o tamanho máximo permitido (5MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /produtos/{produtoId}/imagens/{imagemId}:
    parameters:
      - $ref: "#/components/parameters/ProdutoId"
      - $ref: "#/components/parameters/ImagemId"
    patch:
      tags: [Imagens]
      summary: Reordenar imagem (atualizar `ordem`)
      operationId: atualizarOrdemImagem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarOrdemImagemRequest"
      responses:
        "200":
          description: Imagem atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagemResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "422":
          $ref: "#/components/responses/ErroValidacao"
    delete:
      tags: [Imagens]
      summary: Remover imagem (registro em banco + arquivo físico em disco)
      operationId: removerImagem
      responses:
        "204":
          description: Imagem removida
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /produtos/{produtoId}/imagens/{imagemId}/principal:
    parameters:
      - $ref: "#/components/parameters/ProdutoId"
      - $ref: "#/components/parameters/ImagemId"
    patch:
      tags: [Imagens]
      summary: Definir imagem como principal (capa) da sua cor
      description: >
        Desmarca atomicamente a imagem principal anterior da mesma cor —
        no máximo uma principal por produto+cor (índice único parcial em
        `produto_imagem`, ver docs/data-model.md decisão #13).
      operationId: definirImagemPrincipal
      responses:
        "200":
          description: Imagem definida como principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagemResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  # ───────────────────────── Estoque ─────────────────────────
  /estoque:
    get:
      tags: [Estoque]
      summary: Listar saldo de estoque por variante
      operationId: listarEstoque
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: sku
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Lista paginada de saldos de estoque
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstoqueListResponse"

  /estoque/alertas:
    get:
      tags: [Estoque]
      summary: Listar variantes com estoque igual ou abaixo do mínimo configurado
      operationId: listarAlertasEstoque
      responses:
        "200":
          description: Lista de variantes em alerta de estoque baixo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EstoqueResponse" }

  /estoque/movimentacoes:
    get:
      tags: [Estoque]
      summary: Listar histórico de movimentações de estoque
      operationId: listarMovimentacoes
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: variante_id
          in: query
          schema: { type: string, format: uuid }
        - name: tipo
          in: query
          schema: { $ref: "#/components/schemas/TipoMovimentacao" }
      responses:
        "200":
          description: Lista paginada de movimentações
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovimentacaoListResponse"
    post:
      tags: [Estoque]
      summary: Registrar movimentação manual de estoque (entrada, saída ou ajuste)
      description: >
        Movimentações originadas de uma venda são criadas automaticamente pelo
        contexto de Vendas ao confirmar um Pedido (ver POST /pedidos) — este
        endpoint é para movimentações manuais (compra, ajuste de inventário,
        devolução, perda).
      operationId: criarMovimentacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarMovimentacaoRequest"
      responses:
        "201":
          description: Movimentação registrada e saldo de estoque atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovimentacaoResponse"
        "422":
          description: Dados inválidos ou saldo insuficiente para SAIDA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  # ───────────────────────── Pedidos (Vendas) ─────────────────────────
  /pedidos:
    get:
      tags: [Pedidos]
      summary: Listar pedidos/vendas
      operationId: listarPedidos
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/StatusPedido" }
        - name: cliente_id
          in: query
          schema: { type: string, format: uuid }
        - name: data_inicio
          in: query
          schema: { type: string, format: date }
        - name: data_fim
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Lista paginada de pedidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoListResponse"
    post:
      tags: [Pedidos]
      summary: Criar e confirmar uma venda
      description: >
        Cria o pedido, seus itens e pagamentos, e confirma a venda em uma única
        transação atômica que também dá baixa no estoque das variantes
        envolvidas (ver docs/SDD.md §5.1). Falha (422) se qualquer item não
        tiver saldo de estoque suficiente — nenhuma alteração parcial é
        persistida.
      operationId: criarPedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarPedidoRequest"
      responses:
        "201":
          description: Pedido criado e confirmado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoDetalheResponse"
        "422":
          description: Dados inválidos ou estoque insuficiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /pedidos/{pedidoId}:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    get:
      tags: [Pedidos]
      summary: Obter pedido por id (com itens e pagamentos)
      operationId: obterPedido
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoDetalheResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /pedidos/{pedidoId}/cancelar:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    patch:
      tags: [Pedidos]
      summary: Cancelar pedido
      description: >
        Se o pedido já estava CONFIRMADO, o cancelamento gera automaticamente
        movimentações de estoque de estorno (tipo ENTRADA, motivo DEVOLUCAO)
        para cada item, também em transação atômica.
      operationId: cancelarPedido
      responses:
        "200":
          description: Pedido cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoDetalheResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Pedido já está cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  # ───────────────────────── Clientes ─────────────────────────
  /clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      operationId: listarClientes
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: busca
          in: query
          description: Busca por nome, e-mail ou CPF/CNPJ
          schema: { type: string }
      responses:
        "200":
          description: Lista paginada de clientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteListResponse"
    post:
      tags: [Clientes]
      summary: Criar cliente
      operationId: criarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarClienteRequest"
      responses:
        "201":
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "422":
          $ref: "#/components/responses/ErroValidacao"

  /clientes/{clienteId}:
    parameters:
      - $ref: "#/components/parameters/ClienteId"
    get:
      tags: [Clientes]
      summary: Obter cliente por id
      operationId: obterCliente
      responses:
        "200":
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Clientes]
      summary: Atualizar cliente
      operationId: atualizarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarClienteRequest"
      responses:
        "200":
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    delete:
      tags: [Clientes]
      summary: Inativar cliente
      operationId: inativarCliente
      responses:
        "204":
          description: Cliente inativado
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  # ───────────────────────── Fornecedores ─────────────────────────
  /fornecedores:
    get:
      tags: [Fornecedores]
      summary: Listar fornecedores
      operationId: listarFornecedores
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: busca
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Lista paginada de fornecedores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FornecedorListResponse"
    post:
      tags: [Fornecedores]
      summary: Criar fornecedor
      operationId: criarFornecedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarFornecedorRequest"
      responses:
        "201":
          description: Fornecedor criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FornecedorResponse"
        "422":
          $ref: "#/components/responses/ErroValidacao"

  /fornecedores/{fornecedorId}:
    parameters:
      - $ref: "#/components/parameters/FornecedorId"
    get:
      tags: [Fornecedores]
      summary: Obter fornecedor por id
      operationId: obterFornecedor
      responses:
        "200":
          description: Fornecedor encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FornecedorResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Fornecedores]
      summary: Atualizar fornecedor
      operationId: atualizarFornecedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarFornecedorRequest"
      responses:
        "200":
          description: Fornecedor atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FornecedorResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    delete:
      tags: [Fornecedores]
      summary: Inativar fornecedor
      operationId: inativarFornecedor
      responses:
        "204":
          description: Fornecedor inativado
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  # ───────────────────────── Relatórios & Dashboard ─────────────────────────
  /dashboard/resumo:
    get:
      tags: [Relatorios]
      summary: Indicadores resumidos para a tela inicial (dashboard)
      operationId: obterResumoDashboard
      parameters:
        - name: data_inicio
          in: query
          schema: { type: string, format: date }
        - name: data_fim
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Resumo de indicadores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResumoResponse"

  /relatorios/vendas-por-periodo:
    get:
      tags: [Relatorios]
      summary: Faturamento e volume de pedidos agregados por dia
      operationId: relatorioVendasPorPeriodo
      parameters:
        - name: data_inicio
          in: query
          required: true
          schema: { type: string, format: date }
        - name: data_fim
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Série temporal de vendas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/VendaPorDia" }

  /relatorios/produtos-mais-vendidos:
    get:
      tags: [Relatorios]
      summary: Ranking de variantes mais vendidas por quantidade/faturamento
      operationId: relatorioProdutosMaisVendidos
      parameters:
        - name: data_inicio
          in: query
          schema: { type: string, format: date }
        - name: data_fim
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Ranking de produtos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProdutoMaisVendido" }

  /relatorios/giro-estoque:
    get:
      tags: [Relatorios]
      summary: Giro de estoque por variante em um período
      operationId: relatorioGiroEstoque
      parameters:
        - name: data_inicio
          in: query
          schema: { type: string, format: date }
        - name: data_fim
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Giro de estoque por variante
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GiroEstoqueItem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProdutoId:
      name: produtoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VarianteId:
      name: varianteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImagemId:
      name: imagemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PedidoId:
      name: pedidoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClienteId:
      name: clienteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FornecedorId:
      name: fornecedorId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    NaoAutorizado:
      description: Credenciais inválidas ou token ausente/expirado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ErroValidacao:
      description: Dados de entrada inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    Pagination:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    # ── Auth ──
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string, format: password, minLength: 8 }
    LoginResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        usuario: { $ref: "#/components/schemas/UsuarioResponse" }
    UsuarioResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        papel: { $ref: "#/components/schemas/PapelUsuario" }
    PapelUsuario:
      type: string
      enum: [ADMIN, VENDEDOR, ESTOQUISTA]

    # ── Categorias ──
    CriarCategoriaRequest:
      type: object
      required: [nome]
      properties:
        nome: { type: string, maxLength: 100 }
    CategoriaResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        slug: { type: string }
        ativo: { type: boolean }
    CategoriaListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CategoriaResponse" }

    # ── Produtos ──
    CriarProdutoRequest:
      type: object
      required: [nome]
      properties:
        nome: { type: string, maxLength: 200 }
        descricao: { type: string }
        categoria_id: { type: string, format: uuid, nullable: true }
        marca: { type: string, default: "AMACTIVE" }
        desconto_percentual:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          nullable: true
          description: "Percentual de desconto promocional. null = sem promoção ativa (ver docs/data-model.md decisão #14)."
    AtualizarProdutoRequest:
      allOf:
        - $ref: "#/components/schemas/CriarProdutoRequest"
        - type: object
          properties:
            ativo: { type: boolean }
    ProdutoResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        descricao: { type: string, nullable: true }
        categoria_id: { type: string, format: uuid, nullable: true }
        marca: { type: string }
        desconto_percentual:
          type: number
          format: decimal
          nullable: true
          description: "null = sem promoção ativa."
        ativo: { type: boolean }
        criado_em: { type: string, format: date-time }
    ProdutoDetalheResponse:
      allOf:
        - $ref: "#/components/schemas/ProdutoResponse"
        - type: object
          properties:
            variantes:
              type: array
              items: { $ref: "#/components/schemas/VarianteResponse" }
    ProdutoListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ProdutoResponse" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    # ── Variantes ──
    Tamanho:
      type: string
      description: Tamanho padrão PP/P/M/G/GG ou numérico (ex "38")
      example: M
    CriarVarianteRequest:
      type: object
      required: [tamanho, cor, preco_venda]
      properties:
        sku: { type: string, description: "Se omitido, é gerado automaticamente" }
        tamanho: { $ref: "#/components/schemas/Tamanho" }
        cor: { type: string, maxLength: 50 }
        preco_venda: { type: string, pattern: '^\d+\.\d{2}$', example: "129.90" }
        preco_custo: { type: string, pattern: '^\d+\.\d{2}$', nullable: true }
        estoque_inicial:
          type: integer
          minimum: 0
          default: 0
          description: Quantidade inicial de estoque, gera uma movimentação ENTRADA/AJUSTE_INVENTARIO automática
    AtualizarVarianteRequest:
      type: object
      properties:
        cor: { type: string }
        preco_venda: { type: string, pattern: '^\d+\.\d{2}$' }
        preco_custo: { type: string, pattern: '^\d+\.\d{2}$', nullable: true }
        ativo: { type: boolean }
    VarianteResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        produto_id: { type: string, format: uuid }
        sku: { type: string }
        tamanho: { $ref: "#/components/schemas/Tamanho" }
        cor: { type: string }
        preco_venda: { type: string }
        preco_custo: { type: string, nullable: true }
        ativo: { type: boolean }
        quantidade_estoque: { type: integer, description: "Saldo atual (denormalizado para conveniência)" }
        desconto_percentual:
          type: string
          nullable: true
          description: "Repassado do produto pai, formatado como os demais campos decimais do contrato. null = sem promoção ativa."
        preco_promocional:
          type: string
          nullable: true
          description: "preco_venda com desconto_percentual já aplicado (ver shared_kernel/money.aplicar_desconto_percentual). null se o produto não tem desconto ativo."

    # ── Imagens ──
    ImagemResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        produto_id: { type: string, format: uuid }
        cor: { type: string }
        url: { type: string, description: "Caminho público, ex: /media/produtos/{produtoId}/{uuid}.jpg" }
        ordem: { type: integer, minimum: 0 }
        principal: { type: boolean }
        criado_em: { type: string, format: date-time }
    ImagemListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ImagemResponse" }
    AtualizarOrdemImagemRequest:
      type: object
      required: [ordem]
      properties:
        ordem: { type: integer, minimum: 0 }

    # ── Estoque ──
    TipoMovimentacao:
      type: string
      enum: [ENTRADA, SAIDA, AJUSTE]
    EstoqueResponse:
      type: object
      properties:
        variante_id: { type: string, format: uuid }
        sku: { type: string }
        produto_nome: { type: string }
        quantidade: { type: integer }
        estoque_minimo: { type: integer }
        em_alerta: { type: boolean }
    EstoqueListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/EstoqueResponse" }
        pagination: { $ref: "#/components/schemas/Pagination" }
    CriarMovimentacaoRequest:
      type: object
      required: [variante_id, tipo, quantidade, motivo]
      properties:
        variante_id: { type: string, format: uuid }
        tipo: { $ref: "#/components/schemas/TipoMovimentacao" }
        quantidade: { type: integer, minimum: 1 }
        motivo:
          type: string
          enum: [COMPRA, AJUSTE_INVENTARIO, DEVOLUCAO, PERDA]
        fornecedor_id: { type: string, format: uuid, nullable: true }
    MovimentacaoResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        variante_id: { type: string, format: uuid }
        sku: { type: string }
        tipo: { $ref: "#/components/schemas/TipoMovimentacao" }
        quantidade: { type: integer }
        motivo: { type: string }
        pedido_id: { type: string, format: uuid, nullable: true }
        fornecedor_id: { type: string, format: uuid, nullable: true }
        usuario_id: { type: string, format: uuid }
        criado_em: { type: string, format: date-time }
    MovimentacaoListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MovimentacaoResponse" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    # ── Pedidos ──
    StatusPedido:
      type: string
      enum: [PENDENTE, CONFIRMADO, CANCELADO]
    FormaPagamento:
      type: string
      enum: [DINHEIRO, PIX, CARTAO_DEBITO, CARTAO_CREDITO]
    ItemPedidoRequest:
      type: object
      required: [variante_id, quantidade]
      properties:
        variante_id: { type: string, format: uuid }
        quantidade: { type: integer, minimum: 1 }
        desconto_item: { type: string, pattern: '^\d+\.\d{2}$', default: "0.00" }
    PagamentoRequest:
      type: object
      required: [forma_pagamento, valor]
      properties:
        forma_pagamento: { $ref: "#/components/schemas/FormaPagamento" }
        valor: { type: string, pattern: '^\d+\.\d{2}$' }
    CriarPedidoRequest:
      type: object
      required: [itens, pagamentos]
      properties:
        cliente_id: { type: string, format: uuid, nullable: true }
        desconto: { type: string, pattern: '^\d+\.\d{2}$', default: "0.00" }
        observacao: { type: string, nullable: true }
        itens:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ItemPedidoRequest" }
        pagamentos:
          type: array
          minItems: 1
          description: "Soma dos valores deve ser igual ao valor_total calculado (suporta pagamento misto)"
          items: { $ref: "#/components/schemas/PagamentoRequest" }
    ItemPedidoResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        variante_id: { type: string, format: uuid }
        sku: { type: string }
        quantidade: { type: integer }
        preco_unitario: { type: string }
        desconto_item: { type: string }
        subtotal: { type: string }
    PagamentoResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        forma_pagamento: { $ref: "#/components/schemas/FormaPagamento" }
        valor: { type: string }
    PedidoResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        cliente_id: { type: string, format: uuid, nullable: true }
        usuario_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/StatusPedido" }
        subtotal: { type: string }
        desconto: { type: string }
        valor_total: { type: string }
        criado_em: { type: string, format: date-time }
        confirmado_em: { type: string, format: date-time, nullable: true }
    PedidoDetalheResponse:
      allOf:
        - $ref: "#/components/schemas/PedidoResponse"
        - type: object
          properties:
            itens:
              type: array
              items: { $ref: "#/components/schemas/ItemPedidoResponse" }
            pagamentos:
              type: array
              items: { $ref: "#/components/schemas/PagamentoResponse" }
    PedidoListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PedidoResponse" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    # ── Clientes ──
    CriarClienteRequest:
      type: object
      required: [nome]
      properties:
        nome: { type: string, maxLength: 150 }
        cpf_cnpj: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        telefone: { type: string, nullable: true }
        endereco_logradouro: { type: string, nullable: true }
        endereco_cidade: { type: string, nullable: true }
        endereco_uf: { type: string, minLength: 2, maxLength: 2, nullable: true }
        endereco_cep: { type: string, nullable: true }
    ClienteResponse:
      allOf:
        - $ref: "#/components/schemas/CriarClienteRequest"
        - type: object
          properties:
            id: { type: string, format: uuid }
            ativo: { type: boolean }
            criado_em: { type: string, format: date-time }
    ClienteListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ClienteResponse" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    # ── Fornecedores ──
    CriarFornecedorRequest:
      type: object
      required: [razao_social]
      properties:
        razao_social: { type: string, maxLength: 150 }
        nome_fantasia: { type: string, nullable: true }
        cnpj: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        telefone: { type: string, nullable: true }
        endereco_logradouro: { type: string, nullable: true }
        endereco_cidade: { type: string, nullable: true }
        endereco_uf: { type: string, minLength: 2, maxLength: 2, nullable: true }
        endereco_cep: { type: string, nullable: true }
    FornecedorResponse:
      allOf:
        - $ref: "#/components/schemas/CriarFornecedorRequest"
        - type: object
          properties:
            id: { type: string, format: uuid }
            ativo: { type: boolean }
            criado_em: { type: string, format: date-time }
    FornecedorListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FornecedorResponse" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    # ── Relatórios & Dashboard ──
    DashboardResumoResponse:
      type: object
      properties:
        faturamento_periodo: { type: string }
        total_pedidos_periodo: { type: integer }
        ticket_medio: { type: string }
        variantes_em_alerta_estoque: { type: integer }
        top_produtos:
          type: array
          items: { $ref: "#/components/schemas/ProdutoMaisVendido" }
    VendaPorDia:
      type: object
      properties:
        dia: { type: string, format: date }
        total_pedidos: { type: integer }
        faturamento: { type: string }
    ProdutoMaisVendido:
      type: object
      properties:
        variante_id: { type: string, format: uuid }
        sku: { type: string }
        produto_nome: { type: string }
        quantidade_vendida: { type: integer }
        faturamento: { type: string }
    GiroEstoqueItem:
      type: object
      properties:
        variante_id: { type: string, format: uuid }
        sku: { type: string }
        total_saidas: { type: integer }
        saldo_atual: { type: integer }
