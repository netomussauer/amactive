# Config nginx da VITRINE (build `npm run build:loja`, ver Dockerfile.loja).
#
# Diferente do nginx do admin (nginx.conf): a vitrine é pública, então a
# superfície exposta é mínima. Só repassa à API as rotas que o cliente final
# usa — catálogo público (/api/loja/) e as fotos de produto (/api/media/).
# Todo o resto do /api/ responde 404 sem tocar a API.
#
# Porta 8080 (não 80): nginx-unprivileged roda como usuário não-root.
server {
    listen 8080;
    server_name _;

    server_tokens off;

    # Mesmos headers de segurança do admin (ver nota em apps/web/nginx.conf
    # sobre `add_header` dentro de `location`: o bloco de assets repete esta
    # lista de propósito).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── API: LISTA DE PERMISSÃO ──────────────────────────────────────────
    # Só estes prefixos chegam à API a partir da vitrine:
    #   loja   → catálogo público e checkout (apps/api/.../vitrine/)
    #   media  → fotos de produto (StaticFiles da API)
    # Qualquer outra rota de /api/ (auth, pedidos, produtos administrativos,
    # /docs, /metrics, webhooks...) responde 404 aqui. Rotas novas da API
    # ficam fora da vitrine até alguém incluí-las deliberadamente.
    #
    # `^~` impede que o location de assets (regex por extensão, abaixo) pegue
    # `/api/media/produtos/x.jpg` e procure o arquivo no disco do nginx.
    location ^~ /api/ {
        if ($uri !~ "^/api/(loja|media)(/|$)") {
            return 404;
        }

        # Só leitura e o checkout (POST). Nada de PUT/PATCH/DELETE pela vitrine.
        limit_except GET POST {
            deny all;
        }

        proxy_pass http://amactive-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Sobrescrevem o que o cliente mandou (nunca acumulam valores forjados).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # SPA com roteamento no cliente (BrowserRouter): rota desconhecida cai no
    # index.html, então F5 em /produtos/xyz funciona.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }
}
