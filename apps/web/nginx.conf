# Config nginx para servir a SPA do AMACTIVE (Vite + React Router).
#
# Porta 8080 (não 80): nginx-unprivileged roda como usuário não-root, que
# não pode bindar portas < 1024 — mesmo motivo pelo qual o Service (ver
# infra/k8s/web/service.yaml) faz targetPort: 8080 com port: 80 exposto.
server {
    listen 8080;
    server_name _;

    # Não anuncia a versão do nginx nas respostas/páginas de erro.
    server_tokens off;

    # Headers de segurança (a app agora também é alcançável pela internet).
    # ATENÇÃO — armadilha do nginx: `add_header` dentro de um `location`
    # DESCARTA todos os `add_header` herdados do `server`; por isso o bloco
    # de assets estáticos abaixo repete esta lista (único location que
    # define `add_header` próprio). Se criar outro location com
    # `add_header`, repita aqui também.
    #
    # CSP: sem CDNs/fontes externas (index.html só carrega script/ícone do
    # próprio build; imagens de produto vêm de /api/media, mesma origem).
    # `style-src 'unsafe-inline'` cobre os atributos `style=` que React/
    # Recharts geram em runtime. `connect-src 'self'` já basta: toda chamada
    # de API é para /api (mesma origem). O auto-inject de Web Analytics do
    # Cloudflare (script externo) seria bloqueado — mantenha-o desativado.
    # HSTS fica a cargo do Cloudflare (TLS termina lá).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoint simples para readiness/liveness probe (ver
    # infra/k8s/web/deployment.yaml) — não depende de nenhum asset do build,
    # então responde mesmo se o `dist/` estiver malformado, isolando erros de
    # infra dos erros de build.
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Proxy reverso da API (mesma origem) ─────────────────────────────
    # O bundle chama a API em `/api/...` (VITE_API_URL=/api, ver
    # apps/web/Dockerfile): este nginx repassa `/api/` para o Service da API
    # DENTRO do cluster. Vantagens: um único hostname/origem — sem CORS, e
    # uma única política do Cloudflare Access cobrindo web + API (o cookie
    # de sessão do Access vai junto em toda chamada; com dois hostnames o
    # navegador precisaria do cookie de cada um). Também funciona igual via
    # LAN (http://192.168.1.213), sem depender de DNS `api.amactive.local`.
    #
    # `^~` é obrigatório: sem ele, o location de assets estáticos abaixo
    # (regex por extensão) ganharia de `/api/media/produtos/x.jpg` e a
    # imagem seria procurada no disco do nginx (404), não na API.
    #
    # LISTA DE PERMISSÃO (não de bloqueio) dos prefixos da API alcançáveis
    # por este caminho — tudo o mais sob /api/ responde 404 do próprio
    # nginx, sem tocar a API. Isso deixa de fora por padrão: documentação
    # interativa (/docs, /redoc, /openapi.json), métricas do Prometheus
    # (/metrics), /health (revela o estado do banco) e o webhook da Nuvemshop
    # (/integracoes; integração em espera — se reativada, expor por um
    # Ingress dedicado com `pathType: Exact`, não por aqui) — e qualquer rota
    # NOVA que a API ganhe no futuro só fica pública se alguém a acrescentar
    # aqui de propósito. Continuam acessíveis só pela LAN, direto no
    # LoadBalancer da API.
    #
    # Lista = primeiro segmento de cada rota de `GET /openapi.json` da API,
    # menos as excluídas acima, mais `media` (StaticFiles das fotos de
    # produto, fora do OpenAPI). AO ADICIONAR UM ROUTER NOVO NA API, incluir
    # o prefixo aqui, senão a tela correspondente recebe 404.
    #
    # `$uri` já vem decodificado e normalizado pelo nginx (`//`, `/./`,
    # `%2e`), então variações de caminho não escapam da regex; a comparação
    # é sensível a maiúsculas (/api/Auth/... cai no 404).
    location ^~ /api/ {
        if ($uri !~ "^/api/(auth|usuarios|categorias|produtos|variantes|estoque|pedidos|clientes|fornecedores|dashboard|relatorios|media)(/|$)") {
            return 404;
        }

        # Upload de imagens de produto (multipart) passa por aqui; o padrão
        # do nginx (1m) rejeitaria fotos comuns. O Ingress público tem o
        # mesmo teto (infra/k8s/web/ingress-public.yaml).
        client_max_body_size 10m;

        # Barra final em proxy_pass: remove o prefixo `/api/` antes de
        # repassar (a API não conhece esse prefixo).
        proxy_pass http://amactive-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Sobrescrevem (não acumulam) o que o cliente mandou: o valor
        # forjado em X-Forwarded-For/-Proto nunca chega à API.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # React Router (BrowserRouter) faz roteamento client-side — qualquer
    # caminho não encontrado como arquivo estático cai para index.html, que
    # então resolve a rota no browser. Sem isso, refresh (F5) em qualquer
    # rota que não seja "/" retorna 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets com hash no nome (padrão do Vite:
    # assets/index-<hash>.js) — seguro porque o nome muda a cada build.
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Repetidos de propósito: `add_header` neste location descarta os do
        # `server` (ver nota no topo do arquivo).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }
}
