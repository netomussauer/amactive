[project]
name = "amactive-api"
version = "0.1.0"
description = "AMACTIVE — API de controle de estoque e vendas (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amactive"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# B008: "function call in default argument" — falso positivo clássico para o
# padrão de injeção de dependência do FastAPI (`Depends(...)` como default
# de parâmetro é a forma documentada e idiomática do framework).
ignore = ["B008"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: testes unitarios, sem I/O (mocks/fakes) — sempre executados",
    "integration: testes de integracao, exigem Postgres acessivel via TEST_DATABASE_URL",
]
