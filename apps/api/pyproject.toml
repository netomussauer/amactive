[project]
name = "amactive-api"
version = "0.1.0"
description = "AMACTIVE — API de controle de estoque e vendas (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
    # Cliente HTTP assíncrono de `contexts/integracao_canais/infrastructure/
    # nuvemshop/client.py` (design §7.5) — promovido de `dev` (onde só
    # existia para o `TestClient` do FastAPI) para dependência principal,
    # já que agora é usado em runtime pelo client da Nuvemshop.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Só usada por tests/unit/test_migrations_configmap_espelho.py (parseia
    # infra/k8s/api/migrations-configmap.yaml) — não é dependência da
    # aplicação. Sem isto instalado, `pytest.importorskip("yaml")` faz esse
    # teste pular silenciosamente tanto localmente quanto em CI.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amactive"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# B008: "function call in default argument" — falso positivo clássico para o
# padrão de injeção de dependência do FastAPI (`Depends(...)` como default
# de parâmetro é a forma documentada e idiomática do framework).
ignore = ["B008"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Testes de integração dependem de um AsyncEngine `session`-scoped (ver
# tests/integration/conftest.py); sem isso, cada teste roda em um novo event
# loop por padrão e o asyncpg quebra ao reusar conexões de um loop diferente
# daquele em que o engine foi criado ("cannot perform operation: another
# operation is in progress").
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: testes unitarios, sem I/O (mocks/fakes) — sempre executados",
    "integration: testes de integracao, exigem Postgres acessivel via TEST_DATABASE_URL",
]
